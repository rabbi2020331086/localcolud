[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localec2-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "pymongo>=4.13,<5",
  "pyjwt>=2.10,<3", "argon2-cffi>=23.1,<26", "cryptography>=44,<46",
  "email-validator>=2.2,<3", "python-multipart>=0.0.20,<1", "psutil>=6.1,<8",
  "httpx>=0.28,<1",
  "pywinpty>=2.0.14,<3; sys_platform == 'win32'"
]

[project.scripts]
localec2-agent = "app.agent:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = true
